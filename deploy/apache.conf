# vhost Apache per time.miaazienda.it -> proxy verso il processo Node (APP_PORT)
<VirtualHost *:443>
    ServerName time.miaazienda.it

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # richiede: a2enmod proxy proxy_http
</VirtualHost>
